name: CI — Build & Lint

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-lint:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate empty contributions placeholder
        run: |
          node -e "
            const fs = require('fs');
            const data = {
              totalContributions: 0,
              weeks: []
            };
            fs.mkdirSync('src/assets', { recursive: true });
            fs.writeFileSync('src/assets/contributions.json', JSON.stringify(data));
            console.log('Placeholder contributions.json created');
          "

      - name: Build Angular app (production)
        run: npm run build -- --configuration production

      - name: Check bundle size
        run: |
          echo "=== Build output ==="
          du -sh dist/mayconsoftware-portfolio/browser/ || true
          ls -lh dist/mayconsoftware-portfolio/browser/*.js 2>/dev/null | head -20 || true
